<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Записки воинствующего сибарита</title>
  <link rel="icon" href="https://podcast.sibarit.org/cover.jpg">
  <style>
    :root {
      --bg: #f6f3ee;
      --text: #1f1d1a;
      --muted: #6b665e;
      --accent: #8a3b12;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171614;
        --text: #ece8e1;
        --muted: #a39d93;
        --accent: #e08a5a;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 64px 16px; text-align: center; }
    h1 { font-size: 28px; line-height: 1.2; margin: 0 0 12px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Страница не найдена</h1>
  <p><a href="/">На главную страницу подкаста</a></p>
</main>
</body>
</html>
