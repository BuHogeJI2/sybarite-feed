[channel]
url = "https://www.youtube.com/@GenadiValdberg/videos"
# the original Russian track; some videos also have an AI-dubbed en-US track.
# The fallback covers tracks without a language label.
audio_format = "bestaudio[ext=m4a][language=ru]/bestaudio[ext=m4a]"
min_duration = 120
batch_size = 50

[feed]
title = "Записки воинствующего сибарита"
author = "Геннадий Вальдберг"
# the channel's "About" text; paragraphs are separated by blank lines
description = """
Кто такой сибарит? Богатый бездельник?.. Ан нет, это человек мыслящий, который предпочел материальным ценностям духовные. Сегодня это не модно. Но я решил пренебречь модой, почему и назвал свой канал – «Записки воинствующего сибарита». Кто-то спросит: почему воинствующего? А потому что право мыслить свободно надо завоевать.

Древнегреческий философ Эпикур как-то сказал (а это 300 лет до н.э.!): «Если, делая что-то, я получаю от этого удовольствие, значит, я поступаю правильно». А Декарт добавил: «Я мыслю, значит, я существую». Вот и давайте мыслить, вкушать от мыслей своих удовольствие, сознавая притом, что поступаем мы правильно. Короче, записывайтесь в сибариты! Не пожалеете.

Мой электронный адрес: genavaldberg@gmail.com
Facebook: https://www.facebook.com/frenkuoldberg"""
donate_url = "https://www.paypal.com/donate?hosted_button_id=QWPFEY2BG92S6"
credit = "BuHogeJI"
credit_url = "https://github.com/BuHogeJI2/sybarite-feed"
link = "https://www.youtube.com/@GenadiValdberg"
language = "ru"
category = "Society & Culture"
subcategory = "Philosophy"
# square, 1400-3000 px; the channel avatar
cover = "cover.jpg"
# itunes:owner is needed only when submitting to Apple/Spotify; left empty until the author agrees
owner_name = ""
owner_email = ""

[storage]
# public URL of the R2 bucket. Subscribers store the feed URL built from it, so changing it loses them
base_url = "https://podcast.sibarit.org"
