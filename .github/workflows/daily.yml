name: daily

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Max videos to download (empty = batch_size from config.toml)
        required: false

permissions:
  contents: read

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      # yt-dlp needs ffmpeg to turn YouTube's DASH m4a into a normal m4a
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      # YouTube changes break older yt-dlp releases; the lock is upgraded on the runner only
      - name: upgrade yt-dlp
        run: |
          uv sync --no-dev --upgrade-package yt-dlp --upgrade-package yt-dlp-ejs
          uv run --locked --no-dev python -c "from importlib.metadata import version as v; print('yt-dlp', v('yt-dlp'), 'yt-dlp-ejs', v('yt-dlp-ejs'))"

      # anonymous downloads from runners fail with "Sign in to confirm you're not a bot"
      - name: write cookies
        run: printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
      - name: check cookies
        run: uv run --locked --no-dev python -m sybarite_feed check-cookies --mask "$RUNNER_TEMP/cookies.txt"

      - name: update feed
        run: uv run --locked --no-dev python -m sybarite_feed run ${LIMIT:+--limit "$LIMIT"}
        env:
          LIMIT: ${{ inputs.limit }}
          YT_COOKIES_FILE: ${{ runner.temp }}/cookies.txt
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

  # GitHub disables scheduled workflows in public repos after 60 days without repository activity.
  # A separate job, so the job holding the cookies and R2 keys gets no write permission
  keepalive:
    needs: update
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/daily.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
