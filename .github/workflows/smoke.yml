name: smoke

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: YouTube video ID to download
        default: 2NgIPVQbK8g

env:
  CHANNEL_URL: https://www.youtube.com/@GenadiValdberg/videos
  VIDEO_URL: https://www.youtube.com/watch?v=${{ inputs.video_id }}
  # the original Russian track; some videos also carry an AI-dubbed en-US track
  FORMAT: bestaudio[ext=m4a][language=ru]

# anonymous downloads (with and without a PO token) fail on runners with LOGIN_REQUIRED
jobs:
  cookies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
      - run: pip install -U "yt-dlp[default]" && yt-dlp --version

      - name: write cookies
        run: printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}

      - name: download
        run: |
          mkdir -p tmp
          time yt-dlp -v -f "$FORMAT" --extractor-args "youtube:lang=ru" \
            --cookies "$RUNNER_TEMP/cookies.txt" \
            -o "tmp/%(id)s.%(ext)s" \
            --print "after_move:format=%(format_id)s language=%(language)s title=%(title)s" \
            "$VIDEO_URL"
          ls -l tmp

  cookies-po-token:
    runs-on: ubuntu-latest
    services:
      bgutil:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports:
          - 4416:4416
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: denoland/setup-deno@v2
      - run: pip install -U "yt-dlp[default]" bgutil-ytdlp-pot-provider && yt-dlp --version

      - name: write cookies
        run: printf '%s\n' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}

      - name: download
        run: |
          mkdir -p tmp
          time yt-dlp -v -f "$FORMAT" --extractor-args "youtube:lang=ru" \
            --cookies "$RUNNER_TEMP/cookies.txt" \
            -o "tmp/%(id)s.%(ext)s" \
            --print "after_move:format=%(format_id)s language=%(language)s title=%(title)s" \
            "$VIDEO_URL"
          ls -l tmp
